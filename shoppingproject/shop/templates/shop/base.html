
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Shopping Store{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>

<nav>
    <h2>My Shopping Store</h2>

    <div>
        <a href="{% url 'shop:product_list' %}">Home</a>
        <a href="{% url 'shop:cart_detail' %}">
            Cart <span class="cart-badge">{{ cart_count }}</span>
        </a>
    </div>
</nav>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
